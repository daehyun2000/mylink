<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>김대현 | MyLink</title>
  <meta name="description" content="김대현(@daehyun2000)의 링크 모음" />
  <meta property="og:title" content="김대현 | MyLink" />
  <meta property="og:description" content="인스타그램, GitHub, 참여한 프로젝트를 한 곳에서" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://daehyun2000.github.io/mylink/" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='11' fill='white' stroke='%2324A05A' stroke-width='6'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f5f7f4;
      --ink: #1d2421;
      --muted: #66706b;
      --line: #24a05a;
      --line-soft: #dcefe3;
      --station: #ffffff;
      --danger: #c8412f;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #121614; --ink: #e9eeeb; --muted: #97a39d;
        --line: #3cc07a; --line-soft: #1c2c23; --station: #121614; --danger: #f0735f;
      }
    }
    :root[data-theme="dark"] {
      --paper: #121614; --ink: #e9eeeb; --muted: #97a39d;
      --line: #3cc07a; --line-soft: #1c2c23; --station: #121614; --danger: #f0735f;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
      font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 16px; line-height: 1.55;
      display: flex; justify-content: center; padding: 56px 16px 72px;
    }
    main { width: 100%; max-width: 440px; }
    a { color: inherit; }
    :focus-visible { outline: 3px solid var(--line); outline-offset: 3px; border-radius: 10px; }

    /* 역 이름판 */
    .sign {
      display: inline-flex; flex-direction: column; align-items: center;
      padding: 14px 34px 12px; border: 6px solid var(--line); border-radius: 999px;
      background: var(--station);
    }
    .sign h1 {
      margin: 0; font-size: 2.6rem; line-height: 1.05; font-weight: 700; letter-spacing: 0.06em;
    }
    .sign .roman { font-size: 0.9rem; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; }

    .intro { margin: 22px 0 40px; }
    .intro p { margin: 0 0 6px; color: var(--muted); max-width: 32em; }
    .intro .handle { font-weight: 500; color: var(--ink); text-decoration: none; border-bottom: 2px solid var(--line); }
    .intro .handle:hover { color: var(--line); }

    /* 노선 */
    .route { list-style: none; margin: 0; padding: 0; position: relative; }
    .route::before {
      content: ""; position: absolute; left: 13px; top: 30px; bottom: 30px; width: 6px;
      background: var(--line); border-radius: 3px;
      transform-origin: top; animation: draw .9s cubic-bezier(.6,0,.2,1) both;
    }
    .stop { position: relative; display: flex; align-items: center; }
    .stop > a {
      flex: 1; min-width: 0; display: flex; align-items: center; gap: 18px;
      padding: 14px 12px 14px 0; min-height: 68px; text-decoration: none; border-radius: 14px;
    }
    .dot {
      flex: none; position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%;
      background: var(--station); border: 6px solid var(--line);
      animation: pop .3s ease-out both;
      transition: background-color .15s;
    }
    .stop:last-child .dot { box-shadow: 0 0 0 4px var(--paper), 0 0 0 8px var(--line); }
    .stop > a:hover .dot, .stop > a:focus-visible .dot { background: var(--line); }
    .stop > a:hover .name { color: var(--line); }
    .label { display: grid; min-width: 0; }
    .name { font-size: 1.15rem; font-weight: 700; line-height: 1.3; transition: color .15s; }
    .desc { font-size: 0.9rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .count { margin-left: auto; font-size: 0.8rem; color: var(--muted); white-space: nowrap; display: none; }
    body.editing .count { display: inline; }
    .ext { margin-left: auto; flex: none; width: 18px; height: 18px; color: var(--muted); }
    body.editing .ext { display: none; }

    .tools { display: none; gap: 6px; }
    body.editing .tools { display: flex; }

    footer { margin-top: 56px; font-size: 0.82rem; color: var(--muted); }

    /* 편집 모드 (?edit) */
    button {
      font: inherit; font-weight: 500; cursor: pointer; color: var(--ink);
      background: transparent; border: 2px solid var(--ink); border-radius: 999px;
      min-width: 44px; min-height: 44px; padding: 0 16px;
    }
    button.primary { background: var(--line); border-color: var(--line); color: #fff; }
    button.danger { border-color: var(--danger); color: var(--danger); }
    .bar { display: none; gap: 10px; margin-top: 32px; flex-wrap: wrap; }
    body.can-edit .bar { display: flex; }
    form {
      display: none; gap: 12px; margin-top: 24px; padding: 20px;
      background: var(--line-soft); border-radius: 18px;
    }
    body.editing form { display: grid; }
    label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 4px; }
    input {
      width: 100%; font: inherit; padding: 10px 12px; min-height: 44px; color: var(--ink);
      background: var(--paper); border: 2px solid transparent; border-radius: 10px;
    }
    input:focus { outline: none; border-color: var(--line); }
    .row { display: grid; grid-template-columns: 76px 1fr; gap: 10px; }
    .error { color: var(--danger); font-size: 0.85rem; min-height: 1.2em; margin: 0; }
    .empty { color: var(--muted); }

    @keyframes draw { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .route::before, .dot { animation: none; }
    }
    @media (max-width: 380px) {
      .sign { padding: 12px 24px 10px; }
      .sign h1 { font-size: 2.2rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="sign">
        <h1>김대현</h1>
        <span class="roman">Kim Daehyun</span>
      </div>
      <div class="intro">
        <p>아이디어를 직접 만들어 보는 걸 좋아합니다. 제가 하는 일과 일상을 여기 모아 뒀어요.</p>
        <p><a class="handle" href="https://github.com/daehyun2000" target="_blank" rel="noopener noreferrer">@daehyun2000</a></p>
      </div>
    </header>

    <ul class="route" id="links" aria-label="링크 목록"></ul>
    <p class="empty" id="empty" hidden>아직 링크가 없습니다. 편집에서 첫 링크를 추가하세요.</p>

    <form id="form" novalidate>
      <strong id="formTitle">링크 추가</strong>
      <div class="row">
        <div>
          <label for="icon">아이콘</label>
          <input id="icon" maxlength="2" placeholder="선택" />
        </div>
        <div>
          <label for="title">이름</label>
          <input id="title" placeholder="예: 블로그" />
        </div>
      </div>
      <div>
        <label for="desc">설명</label>
        <input id="desc" placeholder="한 줄 설명 (선택)" />
      </div>
      <div>
        <label for="url">주소</label>
        <input id="url" placeholder="https://example.com" inputmode="url" />
      </div>
      <p class="error" id="error" role="alert"></p>
      <div style="display:flex;gap:10px">
        <button type="submit" class="primary" id="submitBtn">추가</button>
        <button type="button" id="cancelBtn" hidden>취소</button>
      </div>
    </form>

    <div class="bar">
      <button type="button" class="primary" id="editToggle">링크 편집</button>
      <button type="button" id="resetBtn">기본 링크로 되돌리기</button>
    </div>

    <footer>「아이디어를 현실로: 바이브 코딩」 수업에서 만든 마이링크입니다.</footer>
  </main>

  <script>
    const KEY = "mylink:v6";
    const DEFAULT_LINKS = [
      { id: 1, title: "Instagram", desc: "@ddae.h_", url: "https://www.instagram.com/ddae.h_/", clicks: 0 },
      { id: 2, title: "GitHub", desc: "코드와 프로젝트", url: "https://github.com/daehyun2000", clicks: 0 },
      { id: 4, title: "Newert 홈페이지", desc: "인턴으로 참여한 회사 홈페이지 리뉴얼", url: "https://newert.co.kr/", clicks: 0 },
      { id: 3, title: "MyLink 저장소", desc: "이 페이지의 소스 코드", url: "https://github.com/daehyun2000/mylink", clicks: 0 },
    ];

    // 편집 기능은 주소 끝에 ?edit 를 붙였을 때만 나타납니다.
    const canEdit = new URLSearchParams(location.search).has("edit");
    if (canEdit) document.body.classList.add("can-edit");

    function load() {
      if (!canEdit) return structuredClone(DEFAULT_LINKS);
      try {
        const saved = JSON.parse(localStorage.getItem(KEY));
        if (Array.isArray(saved)) return saved;
      } catch (e) {}
      return structuredClone(DEFAULT_LINKS);
    }
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(links)); } catch (e) {}
    }

    let links = load();
    let editingId = null;

    const $ = (id) => document.getElementById(id);
    const list = $("links");
    const EXT_ICON = '<svg class="ext" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 4h9v9M16 4 5 15"/></svg>';

    function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return url; } }

    function render() {
      list.innerHTML = "";
      $("empty").hidden = links.length > 0;
      links.forEach((link, i) => {
        const li = document.createElement("li");
        li.className = "stop";

        const a = document.createElement("a");
        a.href = link.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.innerHTML =
          '<span class="dot" aria-hidden="true"></span>' +
          '<span class="label"><span class="name"></span><span class="desc"></span></span>' +
          '<span class="count"></span>' + EXT_ICON;
        a.querySelector(".dot").style.animationDelay = `${0.25 + i * 0.12}s`;
        a.querySelector(".name").textContent = (link.icon ? link.icon + " " : "") + link.title;
        a.querySelector(".desc").textContent = link.desc || hostOf(link.url);
        a.querySelector(".count").textContent = `클릭 ${link.clicks || 0}`;
        a.addEventListener("click", (e) => {
          if (document.body.classList.contains("editing")) { e.preventDefault(); return; }
          if (!canEdit) return;
          link.clicks = (link.clicks || 0) + 1;
          save();
          a.querySelector(".count").textContent = `클릭 ${link.clicks}`;
        });

        const tools = document.createElement("div");
        tools.className = "tools";
        const edit = document.createElement("button");
        edit.type = "button"; edit.textContent = "수정"; edit.ariaLabel = `${link.title} 수정`;
        edit.onclick = () => startEdit(link.id);
        const del = document.createElement("button");
        del.type = "button"; del.className = "danger"; del.textContent = "삭제"; del.ariaLabel = `${link.title} 삭제`;
        del.onclick = () => {
          if (confirm(`'${link.title}' 링크를 삭제할까요?`)) {
            links = links.filter((l) => l.id !== link.id);
            if (editingId === link.id) resetForm();
            save(); render();
          }
        };
        tools.append(edit, del);

        li.append(a, tools);
        list.append(li);
      });
    }

    function isValidUrl(value) {
      try {
        const u = new URL(value);
        return u.protocol === "http:" || u.protocol === "https:";
      } catch { return false; }
    }

    function resetForm() {
      editingId = null;
      $("form").reset();
      $("error").textContent = "";
      $("formTitle").textContent = "링크 추가";
      $("submitBtn").textContent = "추가";
      $("cancelBtn").hidden = true;
    }

    function startEdit(id) {
      const link = links.find((l) => l.id === id);
      if (!link) return;
      editingId = id;
      $("icon").value = link.icon || "";
      $("title").value = link.title;
      $("desc").value = link.desc || "";
      $("url").value = link.url;
      $("formTitle").textContent = "링크 수정";
      $("submitBtn").textContent = "저장";
      $("cancelBtn").hidden = false;
      $("title").focus();
    }

    $("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const icon = $("icon").value.trim();
      const title = $("title").value.trim();
      const desc = $("desc").value.trim();
      let url = $("url").value.trim();
      if (url && !/^https?:\/\//i.test(url)) url = "https://" + url;

      if (!title || !url) { $("error").textContent = "이름과 주소를 모두 입력하세요."; return; }
      if (!isValidUrl(url)) { $("error").textContent = "주소는 https:// 로 시작하는 형식이어야 합니다."; return; }

      if (editingId !== null) {
        const link = links.find((l) => l.id === editingId);
        Object.assign(link, { icon, title, desc, url });
      } else {
        links.push({ id: Date.now(), icon, title, desc, url, clicks: 0 });
      }
      save(); render(); resetForm();
    });

    $("cancelBtn").onclick = resetForm;

    $("editToggle").onclick = () => {
      const on = document.body.classList.toggle("editing");
      $("editToggle").textContent = on ? "편집 마치기" : "링크 편집";
      if (!on) resetForm();
    };

    $("resetBtn").onclick = () => {
      if (confirm("링크 목록을 기본 링크로 되돌릴까요?")) {
        links = structuredClone(DEFAULT_LINKS);
        save(); render(); resetForm();
      }
    };

    render();
  </script>
</body>
</html>
