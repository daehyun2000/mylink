<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>마이링크 MyLink</title>
  <meta name="description" content="나의 링크를 한 페이지에 모아 공유하는 마이링크" />
  <meta property="og:title" content="마이링크 MyLink" />
  <meta property="og:description" content="나의 링크를 한 페이지에 모아 공유하는 마이링크" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>" />
  <style>
    :root {
      --bg: #fff7e8;
      --card: #ffffff;
      --ink: #111111;
      --muted: #5c5c5c;
      --accent: #ffd23f;
      --accent-2: #7bdff2;
      --danger: #ff6b6b;
      --shadow: 4px 4px 0 var(--ink);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #16161a; --card: #24242b; --ink: #f4f4f4; --muted: #b0b0b8;
        --accent: #e0b400; --accent-2: #2f9db3; --danger: #e05555;
      }
    }
    :root[data-theme="dark"] {
      --bg: #16161a; --card: #24242b; --ink: #f4f4f4; --muted: #b0b0b8;
      --accent: #e0b400; --accent-2: #2f9db3; --danger: #e05555;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      display: flex; justify-content: center; padding: 40px 16px 64px;
    }
    main { width: 100%; max-width: 480px; }
    .profile { text-align: center; margin-bottom: 28px; }
    .avatar {
      width: 96px; height: 96px; margin: 0 auto 14px; border-radius: 50%;
      background: var(--accent); border: 3px solid var(--ink); box-shadow: var(--shadow);
      display: grid; place-items: center; font-size: 44px;
    }
    h1 { margin: 0 0 6px; font-size: 1.5rem; }
    .bio { margin: 0; color: var(--muted); }
    .links { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
    .link {
      display: flex; align-items: center; gap: 8px; background: var(--card);
      border: 3px solid var(--ink); border-radius: 14px; box-shadow: var(--shadow);
      transition: transform .1s, box-shadow .1s;
    }
    .link:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
    .link a {
      flex: 1; min-height: 56px; display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; color: inherit; text-decoration: none; font-weight: 700; min-width: 0;
    }
    .link .icon { font-size: 1.4rem; }
    .link .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .link .count { margin-left: auto; font-size: .78rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
    .tools { display: none; gap: 6px; padding-right: 10px; }
    body.editing .tools { display: flex; }
    button {
      font: inherit; font-weight: 700; cursor: pointer; color: var(--ink);
      background: var(--card); border: 2px solid var(--ink); border-radius: 10px;
      min-width: 44px; min-height: 44px; padding: 0 12px;
    }
    button.primary { background: var(--accent); box-shadow: 3px 3px 0 var(--ink); }
    button.danger { background: var(--danger); }
    button:active { transform: translate(1px, 1px); }
    .bar { display: flex; justify-content: center; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
    form {
      display: none; margin-top: 18px; padding: 18px; background: var(--card);
      border: 3px solid var(--ink); border-radius: 14px; box-shadow: var(--shadow); gap: 10px;
    }
    body.editing form { display: grid; }
    label { font-size: .85rem; font-weight: 700; }
    input {
      width: 100%; font: inherit; padding: 10px 12px; min-height: 44px; color: var(--ink);
      background: var(--bg); border: 2px solid var(--ink); border-radius: 10px;
    }
    .row { display: grid; grid-template-columns: 72px 1fr; gap: 10px; }
    .error { color: var(--danger); font-size: .85rem; min-height: 1.2em; margin: 0; }
    .empty { text-align: center; color: var(--muted); }
    footer { margin-top: 40px; text-align: center; font-size: .8rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <section class="profile">
      <div class="avatar" aria-hidden="true">🙂</div>
      <h1 id="name">마이링크</h1>
      <p class="bio" id="bio">나의 링크를 한 곳에 모았어요</p>
    </section>

    <ul class="links" id="links"></ul>
    <p class="empty" id="empty" hidden>아직 링크가 없어요. 편집 모드에서 추가해 보세요.</p>

    <form id="form" novalidate>
      <strong id="formTitle">새 링크 추가</strong>
      <div class="row">
        <div>
          <label for="icon">아이콘</label>
          <input id="icon" maxlength="2" placeholder="🔗" />
        </div>
        <div>
          <label for="title">제목</label>
          <input id="title" placeholder="예: 나의 블로그" />
        </div>
      </div>
      <div>
        <label for="url">주소 (URL)</label>
        <input id="url" placeholder="https://example.com" inputmode="url" />
      </div>
      <p class="error" id="error" role="alert"></p>
      <div class="bar" style="margin-top:0">
        <button type="submit" class="primary" id="submitBtn">추가</button>
        <button type="button" id="cancelBtn" hidden>취소</button>
      </div>
    </form>

    <div class="bar">
      <button type="button" class="primary" id="editToggle">✏️ 편집</button>
      <button type="button" id="resetBtn">기본값으로</button>
    </div>

    <footer>MyLink · 아이디어를 현실로: 바이브 코딩</footer>
  </main>

  <script>
    const KEY = "mylink:v2";
    const DEFAULT_LINKS = [
      { id: 1, icon: "🐙", title: "GitHub 프로필", url: "https://github.com/daehyun2000", clicks: 0 },
      { id: 2, icon: "🔗", title: "마이링크 저장소", url: "https://github.com/daehyun2000/mylink", clicks: 0 },
    ];

    function load() {
      try {
        const saved = JSON.parse(localStorage.getItem(KEY));
        if (Array.isArray(saved)) return saved;
      } catch (e) {}
      return structuredClone(DEFAULT_LINKS);
    }
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(links)); } catch (e) {}
    }

    let links = load();
    let editingId = null;

    const $ = (id) => document.getElementById(id);
    const list = $("links");

    function render() {
      list.innerHTML = "";
      $("empty").hidden = links.length > 0;
      for (const link of links) {
        const li = document.createElement("li");
        li.className = "link";

        const a = document.createElement("a");
        a.href = link.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.innerHTML = '<span class="icon"></span><span class="title"></span><span class="count"></span>';
        a.querySelector(".icon").textContent = link.icon || "🔗";
        a.querySelector(".title").textContent = link.title;
        a.querySelector(".count").textContent = `클릭 ${link.clicks || 0}`;
        a.addEventListener("click", (e) => {
          if (document.body.classList.contains("editing")) { e.preventDefault(); return; }
          link.clicks = (link.clicks || 0) + 1;
          save();
          a.querySelector(".count").textContent = `클릭 ${link.clicks}`;
        });

        const tools = document.createElement("div");
        tools.className = "tools";
        const edit = document.createElement("button");
        edit.type = "button"; edit.textContent = "✏️"; edit.ariaLabel = `${link.title} 수정`;
        edit.onclick = () => startEdit(link.id);
        const del = document.createElement("button");
        del.type = "button"; del.className = "danger"; del.textContent = "🗑️"; del.ariaLabel = `${link.title} 삭제`;
        del.onclick = () => {
          if (confirm(`'${link.title}' 링크를 삭제할까요?`)) {
            links = links.filter((l) => l.id !== link.id);
            if (editingId === link.id) resetForm();
            save(); render();
          }
        };
        tools.append(edit, del);

        li.append(a, tools);
        list.append(li);
      }
    }

    function isValidUrl(value) {
      try {
        const u = new URL(value);
        return u.protocol === "http:" || u.protocol === "https:";
      } catch { return false; }
    }

    function resetForm() {
      editingId = null;
      $("form").reset();
      $("error").textContent = "";
      $("formTitle").textContent = "새 링크 추가";
      $("submitBtn").textContent = "추가";
      $("cancelBtn").hidden = true;
    }

    function startEdit(id) {
      const link = links.find((l) => l.id === id);
      if (!link) return;
      editingId = id;
      $("icon").value = link.icon || "";
      $("title").value = link.title;
      $("url").value = link.url;
      $("formTitle").textContent = "링크 수정";
      $("submitBtn").textContent = "저장";
      $("cancelBtn").hidden = false;
      $("title").focus();
    }

    $("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const icon = $("icon").value.trim();
      const title = $("title").value.trim();
      let url = $("url").value.trim();
      if (url && !/^https?:\/\//i.test(url)) url = "https://" + url;

      if (!title || !url) { $("error").textContent = "제목과 주소를 모두 입력해 주세요."; return; }
      if (!isValidUrl(url)) { $("error").textContent = "올바른 주소 형식이 아니에요."; return; }

      if (editingId !== null) {
        const link = links.find((l) => l.id === editingId);
        Object.assign(link, { icon, title, url });
      } else {
        links.push({ id: Date.now(), icon, title, url, clicks: 0 });
      }
      save(); render(); resetForm();
    });

    $("cancelBtn").onclick = resetForm;

    $("editToggle").onclick = () => {
      const on = document.body.classList.toggle("editing");
      $("editToggle").textContent = on ? "✅ 완료" : "✏️ 편집";
      if (!on) resetForm();
    };

    $("resetBtn").onclick = () => {
      if (confirm("링크 목록을 기본값으로 되돌릴까요?")) {
        links = structuredClone(DEFAULT_LINKS);
        save(); render(); resetForm();
      }
    };

    render();
  </script>
</body>
</html>
